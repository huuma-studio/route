name: ci
run-name: change request by ${{ github.actor }}
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
      # Format, lint and type check.
      - run: vp check
      # Catches JSR publish errors (slow types, missing exports) before merge.
      - run: vp dlx jsr publish --dry-run
  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
      # Includes test/workers, which runs the app in workerd without nodejs_compat.
      - run: vp test
  test-bun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
      # Runs the same suite on the Bun runtime.
      - run: bun run test:bun
