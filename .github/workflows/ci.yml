name: ci
run-name: change request by ${{ github.actor }}
on:
  pull_request:
  # Publish runs the same checks before it releases.
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          run-install: |
            - args: ["--frozen-lockfile"]
      # Format, lint and type check.
      - run: vp check
      # Catches JSR publish errors (slow types, missing exports) before merge.
      - run: vp dlx jsr@0.14.3 publish --dry-run
  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          run-install: |
            - args: ["--frozen-lockfile"]
      # Includes test/workers, which runs the app in workerd without nodejs_compat.
      - run: vp test
  test-bun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          run-install: |
            - args: ["--frozen-lockfile"]
      # Runs the same suite on the Bun runtime.
      - run: vp run test:bun
  test-deno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The test suite doesn't run on Deno, so serve the smoke-test app from
      # source with Deno.serve and only the permissions the README documents.
      - run: deno task test:deno
